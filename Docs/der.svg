<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="800" viewBox="0 0 1130 800" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .caixa { fill: #ffffff; stroke: #c9ced6; stroke-width: 1.5; }
    .cabecalho { fill: #8c2f39; }
    .titulo { fill: #ffffff; font-size: 15px; font-weight: 700; }
    .attr { fill: #1f2430; font-size: 13px; }
    .tag { fill: #8a94a6; font-size: 11px; font-weight: 700; }
    .linha { stroke: #6b7280; stroke-width: 1.6; fill: none; }
    .tracejada { stroke: #8a94a6; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; }
    .card { fill: #8c2f39; font-size: 13px; font-weight: 700; }
    .nota { fill: #6b7280; font-size: 12px; font-style: italic; }
    .legenda { fill: #6b7280; font-size: 12px; }
  </style>

  <rect width="1130" height="800" fill="#ffffff"/>
  <text x="50" y="30" font-size="18" font-weight="700" fill="#1f2430">DER — Sistema de Restaurante (MySQL 8.0)</text>

  <!-- ============ categoria ============ -->
  <g>
    <rect class="caixa" x="50" y="50" width="270" height="80" rx="6"/>
    <path class="cabecalho" d="M50 56 a6 6 0 0 1 6 -6 h258 a6 6 0 0 1 6 6 v22 h-270 z"/>
    <text class="titulo" x="62" y="72">categoria</text>
    <text class="attr" x="62" y="100">id_categoria</text><text class="tag" x="250" y="100">PK</text>
    <text class="attr" x="62" y="122">nome</text><text class="tag" x="250" y="122">UNIQUE</text>
  </g>

  <!-- ============ garcom ============ -->
  <g>
    <rect class="caixa" x="430" y="50" width="270" height="102" rx="6"/>
    <path class="cabecalho" d="M430 56 a6 6 0 0 1 6 -6 h258 a6 6 0 0 1 6 6 v22 h-270 z"/>
    <text class="titulo" x="442" y="72">garcom</text>
    <text class="attr" x="442" y="100">id_garcom</text><text class="tag" x="630" y="100">PK</text>
    <text class="attr" x="442" y="122">nome</text>
    <text class="attr" x="442" y="144">telefone</text>
  </g>

  <!-- ============ mesa ============ -->
  <g>
    <rect class="caixa" x="810" y="50" width="270" height="124" rx="6"/>
    <path class="cabecalho" d="M810 56 a6 6 0 0 1 6 -6 h258 a6 6 0 0 1 6 6 v22 h-270 z"/>
    <text class="titulo" x="822" y="72">mesa</text>
    <text class="attr" x="822" y="100">id_mesa</text><text class="tag" x="1010" y="100">PK</text>
    <text class="attr" x="822" y="122">numero</text><text class="tag" x="1010" y="122">UNIQUE</text>
    <text class="attr" x="822" y="144">capacidade</text>
    <text class="attr" x="822" y="166">situacao</text><text class="tag" x="1010" y="166">ENUM</text>
  </g>

  <!-- ============ produto ============ -->
  <g>
    <rect class="caixa" x="50" y="230" width="270" height="124" rx="6"/>
    <path class="cabecalho" d="M50 236 a6 6 0 0 1 6 -6 h258 a6 6 0 0 1 6 6 v22 h-270 z"/>
    <text class="titulo" x="62" y="252">produto</text>
    <text class="attr" x="62" y="280">id_produto</text><text class="tag" x="250" y="280">PK</text>
    <text class="attr" x="62" y="302">nome</text>
    <text class="attr" x="62" y="324">preco</text>
    <text class="attr" x="62" y="346">id_categoria</text><text class="tag" x="250" y="346">FK</text>
  </g>

  <!-- ============ pedido ============ -->
  <g>
    <rect class="caixa" x="430" y="230" width="270" height="168" rx="6"/>
    <path class="cabecalho" d="M430 236 a6 6 0 0 1 6 -6 h258 a6 6 0 0 1 6 6 v22 h-270 z"/>
    <text class="titulo" x="442" y="252">pedido</text>
    <text class="attr" x="442" y="280">id_pedido</text><text class="tag" x="630" y="280">PK</text>
    <text class="attr" x="442" y="302">id_conta</text><text class="tag" x="630" y="302">FK</text>
    <text class="attr" x="442" y="324">id_garcom</text><text class="tag" x="630" y="324">FK</text>
    <text class="attr" x="442" y="346">data_hora</text><text class="tag" x="630" y="346">INDEX</text>
    <text class="attr" x="442" y="368">situacao</text><text class="tag" x="630" y="368">ENUM</text>
    <text class="attr" x="442" y="390">total</text><text class="tag" x="604" y="390">TRIGGER</text>
  </g>

  <!-- ============ conta ============ -->
  <g>
    <rect class="caixa" x="810" y="230" width="270" height="190" rx="6"/>
    <path class="cabecalho" d="M810 236 a6 6 0 0 1 6 -6 h258 a6 6 0 0 1 6 6 v22 h-270 z"/>
    <text class="titulo" x="822" y="252">conta</text>
    <text class="attr" x="822" y="280">id_conta</text><text class="tag" x="1010" y="280">PK</text>
    <text class="attr" x="822" y="302">id_mesa</text><text class="tag" x="1010" y="302">FK</text>
    <text class="attr" x="822" y="324">data_abertura</text><text class="tag" x="984" y="324">INDEX</text>
    <text class="attr" x="822" y="346">data_fechamento</text>
    <text class="attr" x="822" y="368">situacao</text><text class="tag" x="1010" y="368">ENUM</text>
    <text class="attr" x="822" y="390">total</text>
    <text class="attr" x="822" y="412">mesa_aberta</text><text class="tag" x="930" y="412">GERADA · UNIQUE</text>
  </g>

  <!-- ============ item_pedido ============ -->
  <g>
    <rect class="caixa" x="50" y="470" width="270" height="146" rx="6"/>
    <path class="cabecalho" d="M50 476 a6 6 0 0 1 6 -6 h258 a6 6 0 0 1 6 6 v22 h-270 z"/>
    <text class="titulo" x="62" y="492">item_pedido</text>
    <text class="attr" x="62" y="520">id_item</text><text class="tag" x="250" y="520">PK</text>
    <text class="attr" x="62" y="542">id_pedido</text><text class="tag" x="250" y="542">FK</text>
    <text class="attr" x="62" y="564">id_produto</text><text class="tag" x="224" y="564">FK · INDEX</text>
    <text class="attr" x="62" y="586">quantidade</text>
    <text class="attr" x="62" y="608">preco_unitario</text>
  </g>

  <!-- ============ grupos_usuarios ============ -->
  <g>
    <rect class="caixa" x="430" y="470" width="270" height="102" rx="6"/>
    <path class="cabecalho" d="M430 476 a6 6 0 0 1 6 -6 h258 a6 6 0 0 1 6 6 v22 h-270 z"/>
    <text class="titulo" x="442" y="492">grupos_usuarios</text>
    <text class="attr" x="442" y="520">id_grupo</text><text class="tag" x="630" y="520">PK</text>
    <text class="attr" x="442" y="542">nome_grupo</text><text class="tag" x="610" y="542">UNIQUE</text>
    <text class="attr" x="442" y="564">descricao</text>
  </g>

  <!-- ============ usuarios ============ -->
  <g>
    <rect class="caixa" x="810" y="470" width="270" height="146" rx="6"/>
    <path class="cabecalho" d="M810 476 a6 6 0 0 1 6 -6 h258 a6 6 0 0 1 6 6 v22 h-270 z"/>
    <text class="titulo" x="822" y="492">usuarios</text>
    <text class="attr" x="822" y="520">id_usuario</text><text class="tag" x="930" y="520">PK · VARCHAR(10)</text>
    <text class="attr" x="822" y="542">nome</text>
    <text class="attr" x="822" y="564">email</text><text class="tag" x="990" y="564">UNIQUE</text>
    <text class="attr" x="822" y="586">senha_hash</text><text class="tag" x="972" y="586">PBKDF2</text>
    <text class="attr" x="822" y="608">id_grupo</text><text class="tag" x="1010" y="608">FK</text>
  </g>

  <!-- ============ sequencia_id ============ -->
  <g>
    <rect class="caixa" x="430" y="660" width="270" height="80" rx="6"/>
    <path class="cabecalho" d="M430 666 a6 6 0 0 1 6 -6 h258 a6 6 0 0 1 6 6 v22 h-270 z"/>
    <text class="titulo" x="442" y="682">sequencia_id</text>
    <text class="attr" x="442" y="710">nome</text><text class="tag" x="630" y="710">PK</text>
    <text class="attr" x="442" y="732">ultimo_valor</text>
  </g>

  <!-- ============ relacionamentos ============ -->

  <!-- categoria 1:N produto -->
  <line class="linha" x1="185" y1="130" x2="185" y2="230"/>
  <text class="card" x="192" y="152">1</text>
  <text class="card" x="192" y="224">N</text>
  <text class="nota" x="205" y="188">possui</text>

  <!-- produto 1:N item_pedido -->
  <line class="linha" x1="185" y1="354" x2="185" y2="470"/>
  <text class="card" x="192" y="376">1</text>
  <text class="card" x="192" y="464">N</text>
  <text class="nota" x="205" y="420">aparece em</text>

  <!-- item_pedido N:1 pedido -->
  <polyline class="linha" points="320,543 375,543 375,440 565,440 565,398"/>
  <text class="card" x="328" y="536">N</text>
  <text class="card" x="548" y="414">1</text>
  <text class="nota" x="392" y="433">compõe</text>

  <!-- garcom 1:N pedido -->
  <line class="linha" x1="565" y1="152" x2="565" y2="230"/>
  <text class="card" x="572" y="172">1</text>
  <text class="card" x="572" y="224">N</text>
  <text class="nota" x="585" y="198">registra</text>

  <!-- conta 1:N pedido -->
  <line class="linha" x1="810" y1="325" x2="700" y2="325"/>
  <text class="card" x="790" y="318">1</text>
  <text class="card" x="710" y="318">N</text>
  <text class="nota" x="722" y="345">agrupa</text>

  <!-- mesa 1:N conta -->
  <line class="linha" x1="945" y1="174" x2="945" y2="230"/>
  <text class="card" x="952" y="192">1</text>
  <text class="card" x="952" y="224">N</text>
  <text class="nota" x="965" y="210">recebe</text>

  <!-- grupos_usuarios 1:N usuarios -->
  <line class="linha" x1="700" y1="521" x2="810" y2="521"/>
  <text class="card" x="706" y="514">1</text>
  <text class="card" x="790" y="514">N</text>
  <text class="nota" x="720" y="541">classifica</text>

  <!-- sequencia_id -> usuarios (apoio, via function) -->
  <polyline class="tracejada" points="700,700 945,700 945,616"/>
  <text class="nota" x="712" y="692">gerar_id_usuario() → USR-000001</text>

  <!-- legenda -->
  <text class="legenda" x="50" y="676">Legenda</text>
  <text class="legenda" x="50" y="696">PK chave primária · FK chave estrangeira · UNIQUE restrição de unicidade</text>
  <text class="legenda" x="50" y="714">INDEX coluna com índice secundário · TRIGGER valor mantido por gatilho</text>
  <text class="legenda" x="50" y="732">GERADA coluna calculada pelo SGBD · 1:N um para muitos</text>
  <text class="legenda" x="50" y="750">Linha tracejada: tabela de apoio usada pela function de geração de IDs</text>
</svg>
